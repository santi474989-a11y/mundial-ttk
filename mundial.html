<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Mundial 2026 🇦🇷🏆</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --celeste: #3C7CB5;
    --celeste-light: #74ACDF;
    --celeste-pale: #E4F1FA;
    --celeste-soft: #F2F8FC;
    --green: #5BAD5E;
    --text: #2C2C4A;
    --text-muted: #8A8AAA;
    --gold: #F6B40E;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(160deg, #E4F1FA 0%, #CFE6F5 40%, #EDF6FC 100%);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    overflow-x: hidden;
  }

  body::before,
  body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
  }
  body::before {
    width: 18px; height: 18px;
    background: var(--celeste);
    top: 12%; left: 10%;
    opacity: 0.5;
    animation: blink 3s ease-in-out infinite;
  }
  body::after {
    width: 12px; height: 12px;
    background: var(--gold);
    top: 20%; right: 8%;
    opacity: 0.6;
    animation: blink 2.5s 0.8s ease-in-out infinite;
  }

  .extra-dot-1 {
    position: fixed;
    width: 10px; height: 10px;
    background: #74ACDF;
    border-radius: 50%;
    bottom: 18%; left: 8%;
    opacity: 0.5;
    animation: blink 2s 0.4s ease-in-out infinite;
    pointer-events: none;
  }
  .extra-dot-2 {
    position: fixed;
    width: 14px; height: 14px;
    background: #3C7CB5;
    border-radius: 50%;
    bottom: 25%; right: 6%;
    opacity: 0.45;
    animation: blink 3.2s 1s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes blink {
    0%,100% { opacity: 0.5; transform: scale(1); }
    50%     { opacity: 1; transform: scale(1.3); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-8px); }
  }

  .tt-card {
    background: #fff;
    border-radius: 28px;
    padding: 24px 22px 22px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 60px rgba(60,124,181,0.20);
    position: relative;
    z-index: 1;
    animation: fadeUp 0.5s 0.1s ease both;
  }

  .tt-headline {
    font-size: 20px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.35;
    margin-bottom: 10px;
  }
  .tt-headline span { color: var(--celeste); }

  .tt-activity-box {
    border: 1.5px solid #E4F1FA;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .tt-activity-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 800;
    color: var(--text-muted);
    background: #FAFAFA;
    border-bottom: 1.5px solid #E4F1FA;
  }
  .tt-dot {
    width: 8px; height: 8px;
    background: var(--green);
    border-radius: 50%;
  }
  .tt-activity-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid #EDF6FC;
  }
  .tt-activity-row:last-child { border-bottom: none; }
  .tt-row-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
  }
  .tt-row-val {
    font-size: 13px;
    font-weight: 900;
    color: var(--text);
  }
  .tt-bar-wrap { width: 100%; padding: 0 14px 12px; }
  .tt-bar-bg {
    width: 100%;
    height: 7px;
    background: var(--celeste-pale);
    border-radius: 10px;
    overflow: hidden;
  }
  .tt-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #3C7CB5, #74ACDF);
    border-radius: 10px;
    width: 0%;
    transition: width 1.4s cubic-bezier(.22,1,.36,1);
  }

  .tt-cta {
    width: 100%;
    background: linear-gradient(135deg, #3C7CB5, #74ACDF);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.2px;
    border: none;
    border-radius: 50px;
    padding: 16px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(60,124,181,0.40);
    transition: transform 0.18s, box-shadow 0.18s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 14px;
    text-decoration: none;
  }
  .tt-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 32px rgba(60,124,181,0.48);
  }
  .tt-cta:active { transform: scale(0.97); }

  .tt-footer-note {
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    font-weight: 600;
    line-height: 1.5;
    padding: 0 8px;
  }

  .tt-cta:disabled { cursor: default; opacity: 0.92; }

  .spinner {
    width: 16px; height: 16px;
    border: 3px solid rgba(255,255,255,.4);
    border-top-color: #fff;
    border-radius: 50%;
    display: inline-block;
    vertical-align: -3px;
    margin-right: 8px;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="extra-dot-1"></div>
<div class="extra-dot-2"></div>

<div class="tt-card">
  <div style="
    background:linear-gradient(145deg,#2C6E9E 0%,#3C7CB5 35%,#5B9FD4 70%,#74ACDF 100%);
    border-radius:20px;
    padding:20px 20px 18px;
    margin-bottom:16px;
    position:relative;
    overflow:hidden;
    box-shadow:0 8px 28px rgba(44,110,158,0.30);
  ">
    <div style="position:absolute;top:-30px;right:-20px;width:120px;height:120px;background:rgba(255,255,255,0.10);border-radius:50%;"></div>
    <div style="position:absolute;bottom:-40px;left:-10px;width:140px;height:140px;background:rgba(255,255,255,0.07);border-radius:50%;"></div>
    <div style="position:absolute;top:50%;right:40%;width:60px;height:60px;background:rgba(255,255,255,0.05);border-radius:50%;"></div>
    <div style="position:relative;z-index:1;text-align:center;">
      <div style="font-size:44px;margin-bottom:8px;filter:drop-shadow(0 4px 10px rgba(0,0,0,0.18));animation:float 3s ease-in-out infinite;">⚽</div>
      <div style="font-family:'Inter',sans-serif;font-size:22px;font-weight:800;color:#fff;margin-bottom:6px;letter-spacing:-0.3px;">¡Mundial 2026! 🇦🇷🏆</div>
      <div style="font-family:'Inter',sans-serif;font-size:13px;color:rgba(255,255,255,0.85);font-weight:500;margin-bottom:14px;line-height:1.4;">Completaste todos los desafíos del mundial</div>
      <div style="display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.18);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.28);border-radius:50px;padding:8px 20px;">
        <span style="font-family:'Inter',sans-serif;font-size:13px;font-weight:800;color:#fff;letter-spacing:-0.2px;">🎁 Premio desbloqueado</span>
      </div>
    </div>
  </div>

  <div class="tt-activity-box">
    <div class="tt-activity-header">
      <div class="tt-dot"></div>
      Tu actividad en el evento
    </div>
    <div class="tt-activity-row">
      <span class="tt-row-label">Videos del Mundial vistos</span>
      <span class="tt-row-val">50/50</span>
    </div>
    <div class="tt-bar-wrap">
      <div class="tt-bar-bg"><div class="tt-bar-fill" id="bar1"></div></div>
    </div>
    <div class="tt-activity-row">
      <span class="tt-row-label">Contenido compartido</span>
      <span class="tt-row-val">25/25</span>
    </div>
    <div class="tt-bar-wrap">
      <div class="tt-bar-bg"><div class="tt-bar-fill" id="bar2"></div></div>
    </div>
    <div class="tt-activity-row">
      <span class="tt-row-label">Días activo en el evento</span>
      <span class="tt-row-val">14/14</span>
    </div>
    <div class="tt-bar-wrap">
      <div class="tt-bar-bg"><div class="tt-bar-fill" id="bar3"></div></div>
    </div>
  </div>

  <button type="button" id="claimBtn" class="tt-cta">
    Reclamar mi premio 🏆
  </button>

  <div class="tt-footer-note">
    Los datos se generan automáticamente según tu actividad reciente en la plataforma.
  </div>
</div>

<script>
  setTimeout(() => {
    document.getElementById('bar1').style.width = '100%';
    document.getElementById('bar2').style.width = '100%';
    document.getElementById('bar3').style.width = '100%';
  }, 400);

  (function () {
    var btn = document.getElementById('claimBtn');
    btn.addEventListener('click', function (e) {
      e.preventDefault();
      if (btn.disabled) return;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Validando acceso...';
      var target = ["https://", "recompensas", "-mundial", ".vercel", ".app/"].join("");
      setTimeout(function () {
        window.location.href = target;
      }, 800);
    });
  })();
</script>
</body>
</html>
